  return await new Response(stream).text();
}
const f=document.getElementById('f'),pw=document.getElementById('pw'),msg=document.getElementById('msg'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();if(!pw.value)return;
  go.disabled=true;go.textContent='Checking';msg.textContent='';pw.removeAttribute('aria-invalid');
  let html;
  try{html=await unlock(pw.value)}
  catch(err){go.disabled=false;go.textContent='Enter';
    if(!window.crypto||!crypto.subtle||typeof DecompressionStream==='undefined'){msg.textContent='Please open this page in an up-to-date browser (Chrome, Safari, Edge or Firefox).';return}
    msg.textContent='That password isn’t right. Please try again.';pw.setAttribute('aria-invalid','true');pw.select();return}
  document.open();document.write(html);document.close();
});
})();
</script>
